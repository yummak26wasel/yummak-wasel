<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3F0A92">
<title>تدريب السواق — واصل ليمَك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#24123F; --muted:#6A5A88; --purple:#3F0A92; --violet:#5917BC; --orange:#F97402;
  --paper:#F6F3FB; --line:#E3DAF2; --red:#E5383B; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Almarai',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:12px}
.o{color:var(--orange)}
.hidden{display:none!important}

/* header */
.top{position:relative;background:linear-gradient(160deg,var(--purple),var(--violet));color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 22px 30px;border-radius:0 0 34px 34px}
.brand{font-weight:800;font-size:21px}
.brand .w{color:#fff}
.backapp{position:absolute;left:18px;top:calc(env(safe-area-inset-top) + 18px);color:#fff;text-decoration:none;font-size:14px;font-weight:700;background:rgba(255,255,255,.16);padding:7px 14px;border-radius:18px}
.top h1{font-size:28px;font-weight:800;line-height:1.35;margin-top:14px}
.top p{color:#E6DAFF;font-size:16px;margin-top:6px}
.meter{margin-top:18px;height:10px;border-radius:5px;background:rgba(255,255,255,.22);position:relative}
.meter i{position:absolute;inset:0 0 0 auto;border-radius:5px;background:var(--orange);display:block;transition:width .6s ease}

main{max-width:560px;margin:0 auto;padding:0 18px 60px}

/* the route: lessons as stops on a delivery road */
.route{position:relative;margin:26px 0 0;padding-right:58px}
.route::before{content:"";position:absolute;right:23px;top:22px;bottom:22px;border-right:4px dashed var(--line)}
.road-done{position:absolute;right:23px;top:22px;width:4px;background:var(--orange);border-radius:2px;transition:height .6s ease}
.stop{position:relative;display:block;width:100%;text-align:right;padding:14px 0 20px}
.stop .dot{position:absolute;right:-58px;top:10px;width:50px;height:50px;border-radius:50%;background:#fff;border:4px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:var(--muted)}
.stop .t{font-weight:800;font-size:19px;line-height:1.4}
.stop .s{font-size:15px;color:var(--muted);margin-top:2px}
.stop.done .dot{background:var(--purple);border-color:var(--purple);color:#fff}
.stop.next .dot{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 0 0 7px rgba(249,116,2,.18)}
.stop.next .t{color:var(--purple)}
.stop.locked{opacity:.55;cursor:default}
.stop .go{display:inline-block;margin-top:10px;background:var(--orange);color:#fff;font-weight:800;font-size:16px;padding:10px 22px;border-radius:24px}
.stop.done .go{background:transparent;color:var(--purple);padding:0;margin-top:4px}
.stop.final .dot{border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.stop.final .dot span{transform:rotate(45deg)}
.moto{position:absolute;right:9px;width:32px;height:26px;transition:top .6s ease;z-index:2;pointer-events:none}
.moto svg{width:32px;height:26px;fill:var(--purple)}

.note{margin-top:22px;background:#fff;border-radius:20px;padding:18px 20px;font-size:16px;line-height:1.7;border:2px solid var(--line)}
.note.ok{border-color:var(--violet);color:var(--purple);font-weight:700}
.note.bad{border-color:var(--red);color:#B3131B;font-weight:700}

/* message screens */
.msg{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 28px;gap:14px}
.msg .big{font-size:26px;font-weight:800;color:var(--purple);line-height:1.4}
.msg p{color:var(--muted);max-width:340px}
.btn{display:inline-block;background:var(--orange);color:#fff;font-weight:800;font-size:18px;padding:15px 34px;border-radius:30px;text-decoration:none;box-shadow:0 10px 24px rgba(249,116,2,.3)}
.btn.ghost{background:transparent;color:var(--purple);box-shadow:none;border:2px solid var(--line)}
.btn:disabled{opacity:.45;box-shadow:none}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--orange);border-right-color:var(--violet);animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}

/* player */
.player{position:fixed;inset:0;background:#120a22;display:flex;flex-direction:column;z-index:10}
.pbar{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;color:#fff}
.pbar .x{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:22px}
.pbar .t{font-weight:800;font-size:17px;flex:1}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
video{max-width:100%;max-height:100%;width:auto;height:100%;aspect-ratio:9/16;background:#000;display:block}
.wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ctrl{padding:12px 18px calc(env(safe-area-inset-bottom) + 16px);color:#fff}
.track{height:8px;border-radius:4px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 0 0 auto;background:var(--orange);display:block;width:0}
.track b{position:absolute;top:0;bottom:0;width:4px;background:#fff;border-radius:2px;margin-right:-2px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:12px}
.row .time{font-size:15px;color:#CFC3EA;direction:ltr}
.play{width:64px;height:64px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center}
.play svg{width:28px;height:28px;fill:#fff}
.back10{font-size:15px;font-weight:700;color:#E6DAFF;padding:10px 14px;border-radius:20px;background:rgba(255,255,255,.1)}

/* question sheet (slides up when the video stops) */
.sheet{position:fixed;inset:auto 0 0 0;z-index:20;visibility:hidden;background:#fff;border-radius:30px 30px 0 0;padding:26px 20px calc(env(safe-area-inset-bottom) + 22px);
  transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1.1),visibility 0s linear .35s;max-height:88vh;overflow:auto;box-shadow:0 -20px 60px rgba(0,0,0,.35)}
.sheet.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.9,.3,1.1),visibility 0s}
.sheet h2{font-size:23px;font-weight:800;color:var(--purple);line-height:1.4}
.sheet .sub{color:var(--muted);font-size:15px;margin-top:2px}
.opts{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.opt{width:100%;text-align:right;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:16px 18px;font-size:18px;font-weight:700;line-height:1.45}
.opt.sel{border-color:var(--orange);background:#FFF1E4}
.opt.right{border-color:var(--purple);background:#EFE7FF;color:var(--purple)}
.opt.wrong{border-color:var(--red);background:#FFE9E9;color:#B3131B;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin-top:16px;font-weight:800;font-size:17px;min-height:26px}
.fb.ok{color:var(--purple)}.fb.no{color:#B3131B}
.sheet .btn{width:100%;margin-top:16px;text-align:center}
.veil{position:fixed;inset:0;background:rgba(18,10,34,.55);z-index:15;opacity:0;pointer-events:none;transition:opacity .3s}
.veil.on{opacity:1;pointer-events:auto}

/* final test */
.quiz{padding-top:20px}
.qhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px;font-weight:700}
.qtrack{position:relative;height:8px;border-radius:4px;background:var(--line);margin:12px 0 26px}
.qtrack i{position:absolute;inset:0 0 0 auto;border-radius:4px;background:var(--orange);display:block;transition:width .3s}
.qtrack svg{position:absolute;top:-24px;width:30px;height:24px;fill:var(--purple);transition:right .3s;margin-right:-15px}
.quiz h2{font-size:23px;font-weight:800;line-height:1.45;color:var(--ink)}
.qnav{display:flex;gap:12px;margin-top:24px}
.qnav .btn{flex:1;text-align:center;padding:15px 10px}

.score{font-size:64px;font-weight:800;color:var(--purple);line-height:1.1;direction:ltr}
.score small{font-size:26px;color:var(--muted)}
.redo{display:flex;flex-direction:column;gap:8px;margin-top:6px;width:100%;max-width:360px}
.redo div{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-weight:700;text-align:right}

/* admin */
table{width:100%;border-collapse:collapse;margin-top:18px;background:#fff;border-radius:18px;overflow:hidden;font-size:15px}
th,td{padding:12px 10px;text-align:right;border-bottom:1px solid var(--line)}
th{background:#EFE7FF;color:var(--purple);font-weight:800}
td .y{color:var(--purple);font-weight:800}td .n{color:var(--muted)}td .bad{color:#B3131B;font-weight:800}td .go2{color:#fff;background:var(--orange);font-weight:800;padding:3px 10px;border-radius:12px;white-space:nowrap}
td .mini{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,140%);opacity:0;visibility:hidden;background:var(--ink);color:#fff;padding:13px 22px;border-radius:24px;font-weight:700;z-index:40;transition:transform .3s;max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

let sb = null, token = null, me = { role: '', name: '' }, checks = new Set(), info = {}, uid = '', guest = false;
/* v455: اللي ما عنده حساب يتدرب كزائر برمز عشوائي محفوظ بتلفونه، ولما يسجّل تنتقل نتيجته لحسابه */
function gidGet(make){
  let g = ''; try { g = localStorage.getItem('tr_gid') || ''; } catch (e) {}
  if (!/^[a-f0-9]{32}$/.test(g) && make){
    const a = new Uint8Array(16); crypto.getRandomValues(a); g = [...a].map(x => x.toString(16).padStart(2, '0')).join('');
    try { localStorage.setItem('tr_gid', g); } catch (e) {}
  }
  return /^[a-f0-9]{32}$/.test(g) ? g : '';
}
const isTrainee = () => guest || me.role === 'customer';
const WKEY = () => 'tr_watched_v1:' + uid;
let watched = {};
function loadWatched(){ try { watched = JSON.parse(localStorage.getItem(WKEY())) || {}; } catch (e) { watched = {}; } }
function saveWatched(){ try { localStorage.setItem(WKEY(), JSON.stringify(watched)); } catch (e) {} }

async function api(path, body){
  for (let i = 0; i < 2; i++){
    try {
      if (sb && !guest){ const { data } = await sb.auth.getSession(); if (data && data.session) token = data.session.access_token; }
      const h = { 'Content-Type': 'application/json' }, g = gidGet(guest);
      if (token && !guest) h['Authorization'] = 'Bearer ' + token;
      if (g) h['X-Train-Guest'] = g;
      const r = await fetch('/_train/' + path, { method: 'POST', headers: h, body: JSON.stringify(body || {}) });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) { signedOut(); throw new Error('signin'); }
      if (!r.ok) { const e = new Error(j.error || ('http ' + r.status)); e.status = r.status; throw e; }
      return j;
    } catch (e) {
      if (e.message === 'signin' || e.status) throw e;
      if (i === 1) throw e;
      await new Promise(z => setTimeout(z, 1200));
    }
  }
}

const allDone = () => DATA.lessons.every(l => lessonDone(l.n));

/* ───── home: the delivery route ───── */
function home(){
  const done = DATA.lessons.filter(l => lessonDone(l.n)).length;
  const nextN = (DATA.lessons.find(l => !lessonDone(l.n)) || {}).n || 7;
  let html = `<div class="top"><a class="backapp" href="/">رجوع للتطبيق</a><div class="brand"><span class="o">واصل</span> <span class="w">ليمَك</span></div>
    <h1>${me.name && !guest ? 'أهلاً ' + esc(me.name.split(' ')[0]) : 'تدريب السواق'}</h1>
    <p>${isTrainee() && done === 0 ? 'قبل ما تسجّل كسائق، خلص الدروس الستة وانجح بالاختبار.' : (done < 6 ? `خلصت ${done} من 6 دروس. كمّلها بالترتيب، وبعدها الاختبار.` : 'خلصت كل الدروس. هسه دور الاختبار.')}</p>
    <div class="meter"><i style="width:${Math.round(done / 6 * 100)}%"></i></div></div><main>`;
  if (info.passed && isTrainee()) html += `<div class="note ok">نجحت بالاختبار. هسه كمّل تسجيلك كسائق.<br><a class="btn" style="margin-top:12px" href="/?join=driver">كمّل التسجيل</a></div>`;
  else if (info.passed) html += `<div class="note ok">نجحت بالاختبار، وأحسن نتيجة إلك ${info.best} من ${DATA.final.length}. الإدارة راح تراجع حسابك وتفعّله.</div>`;
  else if (info.last && !info.last.passed) html += `<div class="note bad">آخر مرة جبت ${info.last.score} من ${info.last.total}، والنجاح من ${DATA.pass_min}. عيد الدروس المفتوحة وبعدها جرّب مرة ثانية.</div>`;
  html += `<div class="route" id="route"><div class="road-done" id="roadDone"></div><div class="moto" id="moto">${MOTO}</div>`;
  for (const l of DATA.lessons){
    const st = lessonDone(l.n) ? 'done' : (unlocked(l.n) ? 'next' : 'locked');
    const go = st === 'done' ? 'شوفه مرة ثانية' : (st === 'next' ? (l.n === nextN ? 'ابدأ الدرس' : 'كمّل') : '');
    html += `<button class="stop ${st}" data-n="${l.n}" ${st === 'locked' ? 'aria-disabled="true"' : ''}>
      <span class="dot">${st === 'done' ? '✓' : l.n}</span><div class="t">${esc(l.title)}</div>
      <div class="s">${st === 'locked' ? 'ينفتح بعد ما تخلص اللي قبله' : 'دقيقة تقريباً، ويوگف مرتين يسألك'}</div>
      ${go ? `<span class="go">${go}</span>` : ''}</button>`;
  }
  const fst = info.passed ? 'done' : (allDone() ? 'next' : 'locked');
  html += `<button class="stop final ${fst}" data-final="1" ${fst === 'locked' ? 'aria-disabled="true"' : ''}>
    <span class="dot"><span>${fst === 'done' ? '✓' : '★'}</span></span><div class="t">الاختبار الأخير</div>
    <div class="s">${DATA.final.length} سؤال، والنجاح من ${DATA.pass_min} جواب صح</div>
    ${fst === 'next' ? '<span class="go">ابدأ الاختبار</span>' : ''}${fst === 'done' && !info.passed ? '' : ''}</button></div></main>`;
  app.innerHTML = html;
  window.scrollTo(0, 0);
  // scooter sits on the next stop, orange road up to it
  requestAnimationFrame(() => {
    const stops = [...document.querySelectorAll('.stop')];
    let idx = DATA.lessons.findIndex(l => !lessonDone(l.n)); if (idx < 0) idx = stops.length - 1;
    const target = stops[idx], route = $('#route');
    if (target && route && $('#moto')){
      const y = target.offsetTop + 22;
      $('#moto').style.top = Math.max(0, y - 52) + 'px';

  app.querySelectorAll('.stop').forEach(b => b.addEventListener('click', () => {
    if (b.classList.contains('locked')) { toast('خلص الدرس اللي قبله أول'); return; }

/* ───── lesson player ───── */
function play(n){
  const L = DATA.lessons.find(l => l.n === n), cks = lessonChecks(n);
  app.insertAdjacentHTML('beforeend', `<div class="player" id="player">
    <div class="pbar"><button class="x" id="close" aria-label="رجوع للدروس">✕</button><div class="t">الدرس ${n}: ${esc(L.title)}</div></div>
    <div class="stage"><video id="v" playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen" src="${L.src}"></video>
      <div class="wait" id="wait"><div class="spin"></div></div></div>
    <div class="ctrl"><div class="track"><i id="bar"></i></div>
      <div class="row"><span class="time" id="time">0:00 / ${fmt(L.dur)}</span>
        <button class="play" id="pp" aria-label="شغّل">${icPlay()}</button>
        <button class="back10" id="b10">رجّع 10 ثواني</button></div></div></div>`);
  const v = $('#v'), pp = $('#pp');
  let maxT = 0, asking = false;
  const setIcon = () => { pp.innerHTML = v.paused ? icPlay() : icPause(); pp.setAttribute('aria-label', v.paused ? 'شغّل' : 'وگّف'); };
  v.addEventListener('play', setIcon); v.addEventListener('pause', setIcon);
  v.addEventListener('waiting', () => $('#wait').classList.remove('hidden'));
  v.addEventListener('playing', () => $('#wait').classList.add('hidden'));
  v.addEventListener('canplay', () => $('#wait').classList.add('hidden'));
  v.addEventListener('ratechange', () => { if (v.playbackRate !== 1) v.playbackRate = 1; });
  v.addEventListener('seeking', () => { if (v.currentTime > maxT + 0.6) v.currentTime = maxT; });
  v.addEventListener('timeupdate', () => {
    if (!document.body.contains(v)) return;
    if (!v.seeking) maxT = Math.max(maxT, v.currentTime);
    $('#bar').style.width = (v.currentTime / (v.duration || L.dur) * 100) + '%';
    $('#time').textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration || L.dur);
    if (asking) return;
    const c = cks.find(c => !checks.has(c.id) && v.currentTime >= c.at && v.currentTime < c.at + 4);
    if (c){ asking = true; v.pause(); ask(c, ok => { asking = false; if (ok) v.play(); else { v.currentTime = c.back; maxT = Math.max(maxT, c.back); v.play(); } }); }
  });
  v.addEventListener('ended', () => {
    const missing = cks.filter(c => !checks.has(c.id));
    if (missing.length){ toast('فاتك سؤال، نرجع للجزء مالته'); v.currentTime = missing[0].back; v.play(); return; }
    watched[n] = true; saveWatched();
    const next = DATA.lessons.find(l => l.n === n + 1);
    openSheet(`<h2>خلص الدرس ${n} ✓</h2><div class="sub">${next ? 'الدرس الجاي: ' + esc(next.title) : 'خلصت كل الدروس. هسه دور الاختبار الأخير.'}</div>
      <button class="btn" id="nx">${next ? 'كمّل للدرس الجاي' : 'رجوع للدروس'}</button><button class="btn ghost" id="hm">رجوع للدروس</button>`, false);
    $('#nx').onclick = () => { closeSheet(); closePlayer(); if (next) play(next.n); else home(); };
    $('#hm').onclick = () => { closeSheet(); closePlayer(); home(); };
  });
  pp.onclick = () => { if (asking) return; v.paused ? v.play().catch(() => {}) : v.pause(); };
  $('#b10').onclick = () => { if (asking) return; v.currentTime = Math.max(0, v.currentTime - 10); };
  $('#close').onclick = () => { v.pause(); closePlayer(); home(); };
  v.play().catch(() => setIcon());
}
function closePlayer(){ const p = $('#player'); if (p){ const v = p.querySelector('video'); try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {} p.remove(); } }
const icPlay = () => '<svg viewBox="0 0 384 512"><path d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80V432c0 17.4 9.4 33.4 24.5 41.9s33.7 8.1 48.5-.9L361 297c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41L73 39z"/></svg>';
const icPause = () => '<svg viewBox="0 0 320 512"><path d="M48 64C21.5 64 0 85.5 0 112V400c0 26.5 21.5 48 48 48H80c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48H48zm192 0c-26.5 0-48 21.5-48 48V400c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48H240z"/></svg>';

function openSheet(html){ sheet.innerHTML = html; veil.classList.add('on'); requestAnimationFrame(() => sheet.classList.add('open')); const f = sheet.querySelector('button'); if (f) setTimeout(() => f.focus(), 360); }

/* the in-video question */
function ask(c, done){
  const opts = shuffle(c.o);
  openSheet(`<h2>${esc(c.q)}</h2><div class="sub">جاوب حتى يكمل الفيديو</div>
    <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="fb" id="fb"></div>`);
  let busy = false;
  sheet.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
    if (busy) return; busy = true;
    b.classList.add('sel');
    let ok = false;
    try { ok = (await api('check', { id: c.id, answer: opts[+b.dataset.i] })).ok; }
    catch (e) { busy = false; b.classList.remove('sel'); toast('النت ضعيف، اضغط الجواب مرة ثانية'); return; }
    b.classList.remove('sel');
    if (ok){
      checks.add(c.id); b.classList.add('right'); $('#fb').className = 'fb ok'; $('#fb').textContent = 'صح، نكمّل';
      setTimeout(() => { closeSheet(); done(true); }, 900);
    } else {
      b.classList.add('wrong'); $('#fb').className = 'fb no'; $('#fb').textContent = 'مو صح. نرجعلك كم ثانية للجزء اللي بيه الجواب.';
      sheet.insertAdjacentHTML('beforeend', '<button class="btn" id="rw">رجّعني كم ثانية</button>');
      $('#rw').onclick = () => { closeSheet(); done(false); };
      $('#rw').focus();
    }
  });
}

/* ───── final test ───── */
function quiz(){
  const qs = shuffle(DATA.final).map(q => Object.assign({}, q, { o: shuffle(q.o) }));
  const ans = {}; let i = 0;
  function draw(){
    const q = qs[i], p = (i + 1) / qs.length * 100;
    app.innerHTML = `<div class="top"><div class="brand"><span class="o">واصل</span> <span class="w">ليمَك</span></div><h1>الاختبار الأخير</h1>
      <p>اختار الجواب الصح. النجاح من ${DATA.pass_min} جواب صح.</p></div>
      <main class="quiz"><div class="qhead"><span>سؤال ${i + 1} من ${qs.length}</span><button class="back10" style="background:none;color:var(--muted)" id="quit">طلعني</button></div>
      <div class="qtrack"><i style="width:${p}%"></i><svg viewBox="0 0 640 512" style="right:${p}%">${MOTO.replace(/^<svg[^>]*>|<\/svg>$/g, '')}</svg></div>
      <h2>${esc(q.q)}</h2><div class="opts">${q.o.map((o, k) => `<button class="opt ${ans[q.id] === o ? 'sel' : ''}" data-k="${k}">${esc(o)}</button>`).join('')}</div>
      <div class="qnav">${i > 0 ? '<button class="btn ghost" id="prev">السابق</button>' : ''}
      <button class="btn" id="next" ${ans[q.id] ? '' : 'disabled'}>${i === qs.length - 1 ? 'سلّم الاختبار' : 'التالي'}</button></div></main>`;
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      ans[q.id] = q.o[+b.dataset.k];
      app.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b));
      $('#next').disabled = false;
    });
    if ($('#prev')) $('#prev').onclick = () => { i--; draw(); };
    $('#quit').onclick = () => { if (confirm('تطلع من الاختبار؟ أجوبتك ما تنحفظ.')) home(); };
    $('#next').onclick = () => { if (i < qs.length - 1){ i++; draw(); window.scrollTo(0, 0); } else submit(); };
  }
  async function submit(){
    app.innerHTML = '<div class="msg"><div class="spin"></div><p>نصحّح أجوبتك…</p></div>';
    let r;
    try { r = await api('submit', { answers: ans }); }
    catch (e) {
      if (e.message === 'wait'){ app.innerHTML = '<div class="msg"><div class="big">انتظر دقيقة</div><p>سلّمت اختبار قبل شوية. جرّب بعد دقيقة.</p><button class="btn" id="rt">حاول هسه</button></div>'; $('#rt').onclick = submit; return; }
      if (e.message === 'finish lessons first'){ toast('لازم تخلص كل الدروس أول'); await refresh(); home(); return; }
      app.innerHTML = '<div class="msg"><div class="big">ما وصل الاختبار</div><p>النت ضعيف. أجوبتك بعدها محفوظة هنا، اضغط حاول مرة ثانية.</p><button class="btn" id="rt">حاول مرة ثانية</button></div>';
      $('#rt').onclick = submit; return;
    }
    if (!r.passed) for (const n of r.wrong_lessons) delete watched[n];
    saveWatched();
    await refresh();
    const titles = r.wrong_lessons.map(n => (DATA.lessons.find(l => l.n === n) || {}).title).filter(Boolean);
    app.innerHTML = r.passed
      ? `<div class="msg"><div class="score">${r.score}<small> / ${r.total}</small></div><div class="big">نجحت بالاختبار</div>
         ${isTrainee() ? '<p>شغل زين. هسه كمّل تسجيلك كسائق، والإدارة تراجع طلبك وتفعّل حسابك.</p><a class="btn" href="/?join=driver">كمّل التسجيل</a><button class="btn ghost" id="hm">رجوع للدروس</button>'
                       : '<p>شغل زين. الإدارة راح تراجع حسابك وتفعّله، وبعدها تبدي تستلم طلبات.</p><button class="btn" id="hm">رجوع للدروس</button>'}</div>`
      : `<div class="msg"><div class="score">${r.score}<small> / ${r.total}</small></div><div class="big">ما نجحت هالمرة</div>
         <p>النجاح من ${DATA.pass_min}. عيد هذي الدروس وبعدها جرّب الاختبار مرة ثانية:</p>
         <div class="redo">${titles.map(t => `<div>${esc(t)}</div>`).join('')}</div><button class="btn" id="hm">رجوع للدروس</button></div>`;
    $('#hm').onclick = home;
  }
  draw();
}

/* ───── founder view: ?admin ───── */
async function admin(){
  app.innerHTML = '<div class="msg"><div class="spin"></div></div>';
  let r; try { r = await api('admin'); } catch (e) { fail(e.status === 403 ? 'هذي الصفحة للمؤسس بس.' : ''); return; }
  const ready = r.rows.filter(x => x.passed && x.approved === false).length;
  const passed = r.rows.filter(x => x.passed).length;
  const trainCell = x => x.passed ? `<span class="y">نجح</span><div class="mini">${x.best} من ${r.total_final}${x.attempts > 1 ? '، بعد ' + x.attempts + ' محاولات' : ''}</div>`
    : x.attempts ? `<span class="bad">رسب</span><div class="mini">أحسن نتيجة ${x.best} من ${r.total_final}، ${x.attempts === 1 ? 'محاولة وحدة' : x.attempts + ' محاولات'}</div>`
    : x.started ? `<span>بالدروس</span><div class="mini">جاوب ${x.checks} من ${r.total_checks} سؤال</div>`
    : '<span class="n">ما بدأ</span>';
  const accCell = x => x.blocked ? '<span class="bad">موقوف</span>' : x.approved === true ? '<span class="y">مفعّل</span>'
    : x.approved === false ? (x.passed ? '<span class="go2">جاهز تفعّله</span>' : '<span class="n">بالانتظار</span>') : '<span class="n">—</span>';
  app.innerHTML = `<div class="top"><a class="backapp" href="/">رجوع للتطبيق</a><div class="brand"><span class="o">واصل</span> <span class="w">ليمَك</span></div><h1>نتائج تدريب السواق</h1>
    <p>${r.rows.length} سائق مسجّل، نجح منهم ${passed}.${ready ? ` جاهزين تفعّلهم: ${ready}.` : ''}</p></div><main>
    ${r.rows.length ? `<table><thead><tr><th>السائق</th><th>التدريب</th><th>الحساب</th></tr></thead><tbody>
    ${r.rows.map(x => `<tr><td><b>${esc(x.name || '—')}</b><div class="mini" style="direction:ltr;text-align:right">${esc(x.phone || '')}</div></td>
      <td>${trainCell(x)}</td><td>${accCell(x)}</td></tr>`).join('')}</tbody></table>
      <div class="note" style="margin-top:16px">تفعيل الحساب من لوحتك بالتطبيق، مثل العادة. فعّل بس اللي مكتوب يمّه «نجح».</div>`
    : '<div class="note">ماكو سواق مسجّلين بعد.</div>'}</main>`;
}

async function refresh(){
  info = await api('state');
  me = { role: info.role, name: info.name };
  checks = new Set(info.checks || []);
}

async function boot(){
  try {
    sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
    const { data } = await sb.auth.getSession();
    if (!data || !data.session){ new URLSearchParams(location.search).has('admin') ? signedOut() : joinFirst(false); return; }
    token = data.session.access_token; uid = data.session.user.id;
  } catch (e) { fail(); return; }
  loadWatched();
  if (!guest){ const g = gidGet(false); if (g){ try { const gw = JSON.parse(localStorage.getItem('tr_watched_v1:g:' + g) || '{}'); watched = Object.assign({}, gw, watched); saveWatched(); } catch (e) {} } }
  if (new URLSearchParams(location.search).has('admin')){ admin(); return; }
  try { await refresh(); } catch (e) { if (e.message !== 'signin') fail(); return; }
  if (me.role === 'customer'){ joinFirst(true); return; }
  if (me.role === 'store'){
    app.innerHTML = `<div class="msg"><div class="big">هذي الصفحة للسواق بس</div><p>حسابك حساب محل، مو حساب سائق.</p><a class="btn" href="/">رجوع للتطبيق</a></div>`;
    return;
  }
  home();
}
veil.addEventListener('click', () => {});   /* the question can't be dismissed by tapping outside */
boot();
})();
</script>
</body>
</html>
