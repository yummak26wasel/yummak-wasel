<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المحلات — واصل ليمّك</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,Tahoma,sans-serif;background:#f5f4f9;color:#1a1a2e;padding:14px;min-height:100vh}
.wrap{max-width:520px;margin:0 auto}
.top{background:linear-gradient(135deg,#3F0A92,#5917BC);color:#fff;padding:20px 18px;border-radius:18px;margin-bottom:16px}
.top h1{font-size:21px;margin-bottom:3px}
.top p{font-size:13px;opacity:.85}
.state{padding:14px;border-radius:12px;font-size:14px;text-align:center;margin-bottom:14px;line-height:1.8}
.state.load{background:#e8e5f3;color:#3F0A92}
.state.err{background:#fde8e8;color:#b91c1c}
.state.ok{background:#e6f7ec;color:#15803d}
.shop{background:#fff;border-radius:16px;padding:15px;margin-bottom:11px;display:flex;gap:13px;align-items:center;box-shadow:0 2px 10px rgba(63,10,146,.07)}
.pic{width:62px;height:62px;border-radius:14px;background:#f0edf7;display:flex;align-items:center;justify-content:center;font-size:27px;flex:none;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.info b{display:block;font-size:16px;margin-bottom:3px}
.info span{font-size:12.5px;color:#6b7280;display:block}
.tag{display:inline-block;margin-top:5px;font-size:11px;padding:3px 9px;border-radius:20px;background:#e6f7ec;color:#15803d}
.tag.off{background:#fde8e8;color:#b91c1c}
.meta{margin-top:16px;font-size:12px;color:#6b7280;text-align:center;line-height:1.9}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1>واصل ليمَك</h1>
    <p>المحلات — من Supabase</p>
  </div>

  <div class="state load" id="state">جاري التحميل...</div>
  <div id="list"></div>
  <div class="meta" id="meta"></div>
</div>

<script>
// ═══ بدّل هذا بمفتاحك ═══
const SB_URL = "https://obvxqyfmcmldruauhsgw.supabase.co";
const SB_KEY = "sb_publishable_HJxHDApXLZVPVQ1p8wqq6w_ELPotqfq";
// ════════════════════════

const ICON = { restaurant:'🍽️', store:'🏪', pharmacy:'💊', other:'🏬' };
const NAME = { restaurant:'مطعم', store:'متجر', pharmacy:'صيدلية', other:'محل' };

async function load(){
  const t0 = Date.now();
  try{
    const r = await fetch(
      SB_URL + '/rest/v1/shops?select=*&is_approved=eq.true&order=sort_order',
      { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY } }
    );

    if(!r.ok) throw new Error('خطأ ' + r.status + ' — ' + (await r.text()).slice(0,120));

    const shops = await r.json();
    const ms = Date.now() - t0;

    if(!shops.length){
      document.getElementById('state').className = 'state err';
      document.getElementById('state').textContent = 'ما أكو محلات معتمدة';
      return;
    }

    document.getElementById('state').className = 'state ok';
    document.getElementById('state').textContent = '✅ وصلت ' + shops.length + ' محل خلال ' + ms + ' جزء من الثانية';

    document.getElementById('list').innerHTML = shops.map(s => `
      <div class="shop">
        <div class="pic">${ s.image_url ? `<img src="${s.image_url}">` : (ICON[s.type] || '🏬') }</div>
        <div class="info">
          <b>${s.name}</b>
          <span>${NAME[s.type] || 'محل'} · ${s.address || 'عانة'}</span>
          <span class="tag ${s.is_open ? '' : 'off'}">${s.is_open ? 'مفتوح' : 'مسكّر'}</span>
        </div>
      </div>
    `).join('');

    document.getElementById('meta').innerHTML =
      'حجم البيانات: ' + Math.round(JSON.stringify(shops).length/1024*10)/10 + ' كيلوبايت<br>' +
      '(بالطريقة القديمة كانت تصير مئات الكيلوبايتات بسبب الصور)';

  }catch(e){
    document.getElementById('state').className = 'state err';
    document.getElementById('state').textContent = '✗ ' + e.message;
  }
}
load();
</script>

</body>
</html>
