name = "leemak-app"
main = "worker/app.js"
compatibility_date = "2024-09-01"
# العنوان القديم يبقى شغّال (تطبيق الأندرويد والآيفون عليه)
workers_dev = true
# عنواننا الخاص — ما تحجبه شبكات الواي فاي
routes = [
  { pattern = "leemak.app", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# v520: صفحة التطبيق تمر على worker/app.js حتى ناخذ ETag (ما تنزل كاملة كل فتحة). باقي الملفات مثل قبل
run_worker_first = ["/", "/index.html"]

# ممرّات للسيرفرات من نفس عنوان التطبيق (worker/app.js)
[[services]]
binding = "OTP"
service = "leemak-otp"

[[services]]
binding = "API"
service = "leemak-api"

[[services]]
binding = "DB"
service = "leemak-db"

# v372: رموز إشعارات تطبيق المتجر (نفس KV مال leemak-api) — حتى «طلب ينتظر قبولك» ينبعث من السيرفر
[[kv_namespaces]]
binding = "PUSH"
id = "84e62138385c4ab78fd59e8c0bd82951"

# v387: شيل خلفية صور المنتجات (Cloudflare Images — segment=foreground) ← worker/app.js /_bg
[images]
binding = "IMAGES"

# v515: قبل النشر — نسخ صغيرة لصور المنتجات المرفوعة على Supabase داخل التطبيق (public/m/sb/)
# tools/sbimg.mjs — إذا فشل ما يوقّف النشر، والتطبيق يرجع للصور الأصلية
[build]
command = "node tools/sbimg.mjs"
watch_dir = "tools"

# v520: رقم النسخة المنشورة — يصير ETag لصفحة التطبيق
[version_metadata]
binding = "CF_VERSION_METADATA"
